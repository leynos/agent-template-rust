name: Act Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  act-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ACT_VERSION: v0.2.80
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@0eabb6bc07148981de5da395e30cd78d83f5c7c2
        with:
          expect-cache: any
          install-mold: 'true'
          install-clang-lld: 'true'
      - name: Setup uv
        uses: astral-sh/setup-uv@5e83ccf689000bf635d77af2cdbad36ca1397375
      - name: Install the generated-project toolchain
        # The template tests run generated `make` targets whose capability
        # preflight never installs anything. Render the template's own default
        # project and let rustup install the toolchain and components its
        # rust-toolchain.toml pins, so the pin has one source.
        run: |
          set -euo pipefail
          project="${RUNNER_TEMP}/template-toolchain"
          rm -rf "${project}"
          uvx --with copier copier copy --defaults --trust . "${project}"
          (cd "${project}" && cargo --version)
      - name: Install the YAML lint tools
        uses: leynos/shared-actions/.github/actions/install-yaml-lint@26c918632c5413039a84358fafe012a4399a9ec7
      - name: Install mdtablefix
        # `make test` renders projects whose `make all` runs `make check-fmt`,
        # and that gate calls `mdtablefix --check --git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@38905b4b2caec5b049438e6dc3f3f6b36c04d2df
        with:
          version: "0.6.1"
      - name: Install template test tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/nektos/act/releases/download/${ACT_VERSION}/act_Linux_x86_64.tar.gz" |
            sudo tar -xz -C /usr/local/bin act
          cargo binstall --no-confirm --locked cargo-nextest
          uv tool install mbake
      - name: Check Docker runtime
        run: docker info
      - name: Install Whitaker
        uses: leynos/shared-actions/.github/actions/install-whitaker@0eabb6bc07148981de5da395e30cd78d83f5c7c2
        with:
          cranelift: true
      - name: Test with act validation
        env:
          PYTEST_ADDOPTS: -rx
        run: make test WITH_ACT=1
