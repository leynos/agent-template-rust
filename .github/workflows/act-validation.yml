name: Act Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  act-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ACT_VERSION: v0.2.84
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@de938e707d6c238b34e29b5770a011e3155e2a3c
      - name: Install act
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/nektos/act/releases/download/${ACT_VERSION}/act_Linux_x86_64.tar.gz" |
            sudo tar -xz -C /usr/local/bin act
      - name: Check Docker runtime
        run: docker info
      - name: Test with act validation
        env:
          ACT_GITHUB_TOKEN: ${{ github.token }}
          PYTEST_ADDOPTS: -rx
        run: make test-act
