name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@d5fded1107ee6822fdbf9539d81ff18ce6ce073a
        with:
          expect-cache: any
          install-mold: 'true'
          install-clang-lld: 'true'
      - name: Setup uv
        uses: astral-sh/setup-uv@4bc6759c82322ff7efa28de54a45404ca6869912
      - name: Check spelling
        run: make spelling
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@d5fded1107ee6822fdbf9539d81ff18ce6ce073a
        with:
          version: "0.6.1"
      - name: Check formatting
        run: make check-fmt
      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make fmt`.
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'
      - name: Install template test tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cargo binstall --no-confirm --locked cargo-nextest
          uv tool install mbake
      - name: Install Whitaker
        uses: leynos/shared-actions/.github/actions/install-whitaker@d5fded1107ee6822fdbf9539d81ff18ce6ce073a
        with:
          cranelift: true
      - name: Test
        run: make test
