name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@0eabb6bc07148981de5da395e30cd78d83f5c7c2
        with:
          expect-cache: any
          install-mold: 'true'
          install-clang-lld: 'true'
      - name: Setup uv
        uses: astral-sh/setup-uv@5e83ccf689000bf635d77af2cdbad36ca1397375
      - name: Install the generated-project toolchain
        # The template tests run generated `make` targets whose capability
        # preflight never installs anything. Render the template's own default
        # project and let rustup install the toolchain and components its
        # rust-toolchain.toml pins, so the pin has one source.
        run: |
          set -euo pipefail
          project="${RUNNER_TEMP}/template-toolchain"
          rm -rf "${project}"
          uvx --with copier copier copy --defaults --trust . "${project}"
          (cd "${project}" && cargo --version)
      - name: Install the YAML lint tools
        uses: leynos/shared-actions/.github/actions/install-yaml-lint@26c918632c5413039a84358fafe012a4399a9ec7
      - name: Check spelling
        run: make spelling
      - name: Check docstring coverage
        run: make interrogate
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@0eabb6bc07148981de5da395e30cd78d83f5c7c2
        with:
          version: "0.6.1"
      - name: Check formatting
        run: make check-fmt
      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make fmt`.
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34  # v25.0.0
        with:
          globs: '**/*.md'
      - name: Install template test tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cargo binstall --no-confirm --locked cargo-nextest
          uv tool install mbake
      - name: Install Whitaker
        uses: leynos/shared-actions/.github/actions/install-whitaker@0eabb6bc07148981de5da395e30cd78d83f5c7c2
        with:
          cranelift: true
      - name: Lint YAML and workflows
        run: |
          set -euo pipefail
          make lint-yaml
          make lint-actions
      - name: Test
        run: make test
