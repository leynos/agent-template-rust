version: 2
# No `labels` are configured anywhere below, deliberately. Dependabot applies
# `dependencies` plus the ecosystem label by default and creates those labels
# in a new repository; once `labels` is defined, the listed labels replace the
# defaults and any label the repository does not already define is ignored. A
# freshly generated project defines none of them, so a custom list would leave
# its update pull requests unlabelled.
updates:
  # Group the shared actions so one revision bump updates every caller, and
  # keep routine GitHub Action minor and patch updates in a single pull
  # request. Cooldowns hold a fresh release until it has been public for a
  # week, leaving time to notice a withdrawn or broken release.
  - package-ecosystem: "github-actions"
    groups:
      shared-actions:
        patterns:
          - 'leynos/shared-actions*'
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  # Cargo minor and patch updates arrive together; a major update stays on its
  # own pull request so its migration can be reviewed separately.
  - package-ecosystem: "cargo"
    directory: "/"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14

  # Keep the pinned Rust toolchain current. The toolchain file selects the
  # nightly the project builds with, so its updates follow the same policy.
  - package-ecosystem: "rust-toolchain"
    directory: "/"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
