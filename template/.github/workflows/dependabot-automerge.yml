name: dependabot-automerge

# Uses pull_request_target to enable auto-merge with write permissions. This is
# safe because the reusable workflow never checks out or executes pull-request
# code; it only reads event metadata and makes GitHub API calls.
#
# Merge only after the required checks pass. The reusable workflow owns that
# policy; this caller supplies the permissions and the pull-request number.

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, ready_for_review]
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: 'Pull request number to merge'
        type: number
        required: true

jobs:
  automerge:
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
      # The called workflow reads `job_workflow_ref` and `job_workflow_sha`
      # from an OIDC token so it can check out the reusable workflow's pinned
      # revision rather than resolving through the caller's workflow context.
      # The token is not used for any external cloud authentication.
      id-token: write
    if: ${{ github.event_name == 'workflow_dispatch' || github.actor == 'dependabot[bot]' }}
    uses: leynos/shared-actions/.github/workflows/dependabot-automerge.yml@0eabb6bc07148981de5da395e30cd78d83f5c7c2
    with:
      pull-request-number: ${{ inputs.pull-request-number || github.event.pull_request.number }}

  dispatch-coverage:
    # The reusable workflow merges with GITHUB_TOKEN, and GitHub does not run
    # push-event workflows for a GITHUB_TOKEN merge. coverage-main.yml also
    # accepts workflow_dispatch, which is exempt from that suppression, so this
    # job starts it once the pull request is observably merged into main.
    # A BLOCKED pull request only has auto-merge armed here; if that later
    # merge fires no push event, coverage-backstop.yml's daily dispatch is the
    # backstop.
    needs: automerge
    if: ${{ needs.automerge.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Dispatch coverage for the merged trunk commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull-request-number || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          base=$(gh pr view "$PULL_REQUEST_NUMBER" \
            --json mergedAt,baseRefName --jq 'select(.mergedAt != null) | .baseRefName')
          if [ "$base" = "main" ]; then
            gh workflow run coverage-main.yml --ref main
          fi
