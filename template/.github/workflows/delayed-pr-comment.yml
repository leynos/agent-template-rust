name: delayed-pr-comment

# Posts one comment after a requested delay. A dispatch is started with
# free-form text, so every input is untrusted: the numeric inputs are
# validated in the shell before arithmetic or `sleep` sees them, and the
# comment body reaches the action as an action input rather than as part of a
# shell command.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to comment on'
        required: true
        type: string
      delay_minutes:
        description: 'Whole minutes to wait before commenting'
        required: true
        type: string
      message:
        description: 'Comment body'
        required: true
        type: string

jobs:
  delay-and-comment:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Validate inputs
        id: validate
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          DELAY_MINUTES: ${{ inputs.delay_minutes }}
        run: |
          for value in "$PR_NUMBER" "$DELAY_MINUTES"; do
            if [[ ! "$value" =~ ^[0-9]+$ ]]; then
              echo "pr_number and delay_minutes must be whole numbers" >&2
              exit 1
            fi
          done
          printf 'delay-seconds=%s\n' "$((10#$DELAY_MINUTES * 60))" >> "$GITHUB_OUTPUT"
      - name: Wait requested time
        run: sleep "${{ steps.validate.outputs.delay-seconds }}"
      - name: Comment on pull request
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b
        with:
          pr-number: ${{ inputs.pr_number }}
          message: ${{ inputs.message }}
